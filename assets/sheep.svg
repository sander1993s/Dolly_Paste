<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <!-- Soft wool shadow gradient -->
    <linearGradient id="woolGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F2EDE4" />
    </linearGradient>
    <!-- Horn gradient -->
    <linearGradient id="hornGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E2C58F" />
      <stop offset="100%" stop-color="#B89354" />
    </linearGradient>
  </defs>

  <!-- 4 Little Sturdy Legs -->
  <rect x="33" y="74" width="6" height="14" rx="3" fill="#2E3640" />
  <rect x="42" y="76" width="6" height="13" rx="3" fill="#202428" />
  <rect x="52" y="76" width="6" height="13" rx="3" fill="#202428" />
  <rect x="61" y="74" width="6" height="14" rx="3" fill="#2E3640" />

  <!-- Fluffy Wool Body (Overlapping Cloud Lobes) -->
  <g fill="url(#woolGrad)" stroke="#DDD8CE" stroke-width="1.5" stroke-linejoin="round">
    <circle cx="34" cy="54" r="14" />
    <circle cx="66" cy="54" r="14" />
    <circle cx="40" cy="42" r="13" />
    <circle cx="60" cy="42" r="13" />
    <circle cx="36" cy="66" r="12" />
    <circle cx="64" cy="66" r="12" />
    <circle cx="50" cy="68" r="14" />
    <circle cx="50" cy="52" r="17" />
  </g>

  <!-- Left Merino Curled Horn -->
  <path d="M 40 42 C 26 30, 10 38, 12 52 C 14 62, 26 62, 28 54 C 29 48, 22 47, 20 51"
        fill="none" stroke="url(#hornGrad)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M 22 38 L 26 43 M 16 48 L 21 50 M 18 56 L 23 54"
        fill="none" stroke="#9A783E" stroke-width="1.2" stroke-linecap="round" />

  <!-- Right Merino Curled Horn -->
  <path d="M 60 42 C 74 30, 90 38, 88 52 C 86 62, 74 62, 72 54 C 71 48, 78 47, 80 51"
        fill="none" stroke="url(#hornGrad)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M 78 38 L 74 43 M 84 48 L 79 50 M 82 56 L 77 54"
        fill="none" stroke="#9A783E" stroke-width="1.2" stroke-linecap="round" />

  <!-- Little Soft Ears -->
  <ellipse cx="32" cy="48" rx="4" ry="2.5" transform="rotate(-20 32 48)" fill="#EADBC8" stroke="#D3C1AD" stroke-width="1" />
  <ellipse cx="68" cy="48" rx="4" ry="2.5" transform="rotate(20 68 48)" fill="#EADBC8" stroke="#D3C1AD" stroke-width="1" />

  <!-- Merino Sheep Face -->
  <ellipse cx="50" cy="54" rx="13" ry="15" fill="#EADBC8" stroke="#D3C1AD" stroke-width="1.5" />

  <!-- Head Wool Crown / Tuft -->
  <g fill="#FAF8F5" stroke="#DDD8CE" stroke-width="1">
    <circle cx="44" cy="38" r="5" />
    <circle cx="56" cy="38" r="5" />
    <circle cx="50" cy="35" r="5.5" />
  </g>

  <!-- Friendly Minimalist Eyes -->
  <circle cx="44.5" cy="51" r="1.8" fill="#202428" />
  <circle cx="45.1" cy="50.4" r="0.6" fill="#FFFFFF" />
  <circle cx="55.5" cy="51" r="1.8" fill="#202428" />
  <circle cx="56.1" cy="50.4" r="0.6" fill="#FFFFFF" />

  <!-- Soft Muzzle / Nose & Mouth -->
  <path d="M 48.5 58 Q 50 59 51.5 58" fill="none" stroke="#8E7864" stroke-width="1.2" stroke-linecap="round" />
  <path d="M 50 56.5 L 50 58.5" fill="none" stroke="#8E7864" stroke-width="1.2" stroke-linecap="round" />
</svg>
